name: manabi-import-test

services:
  postgres-test:
    image: postgres:18
    container_name: manabi-postgres-test
    environment:
      POSTGRES_DB: manabi_import_test_v1
      POSTGRES_USER: manabi_test
      POSTGRES_PASSWORD: ${MANABI_TEST_POSTGRES_PASSWORD:?Set the exclusive temporary test password}
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - postgres-test-data:/var/lib/postgresql
    networks:
      - postgres-test-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 3s
      timeout: 3s
      retries: 30
      start_period: 10s
    restart: "no"

volumes:
  postgres-test-data:
    name: manabi-postgres-test-data

networks:
  postgres-test-network:
    name: manabi-postgres-test-network
    driver: bridge
