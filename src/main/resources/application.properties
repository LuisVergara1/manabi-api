spring.application.name=manabi-api
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.clean-disabled=true
spring.flyway.baseline-on-migrate=false
spring.sql.init.mode=never
spring.jackson.time-zone=America/Santiago
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha

# Administrative authentication: external values only. No implicit .env loader.
manabi.admin.bootstrap.username=${MANABI_ADMIN_USERNAME:}
manabi.admin.bootstrap.password=${MANABI_ADMIN_PASSWORD:}
manabi.security.allowed-origins=${MANABI_ADMIN_ALLOWED_ORIGINS:}
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=${MANABI_SESSION_COOKIE_SECURE:true}
server.servlet.session.cookie.same-site=${MANABI_SESSION_SAME_SITE:lax}
server.servlet.session.cookie.path=/
server.servlet.session.timeout=${MANABI_SESSION_TIMEOUT:20m}
server.servlet.session.tracking-modes=cookie
server.forward-headers-strategy=${MANABI_FORWARD_HEADERS_STRATEGY:NONE}
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-exception=false
server.error.include-binding-errors=never
server.tomcat.max-http-form-post-size=16KB
server.max-http-request-header-size=16KB
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
springdoc.api-docs.enabled=${MANABI_API_DOCS_ENABLED:true}
springdoc.swagger-ui.enabled=true

spring.jackson.deserialization.fail-on-unknown-properties=true
spring.mvc.log-request-details=false
logging.level.org.springframework.security=INFO

# Administrative server is local-only unless explicitly configured behind a trusted proxy.
server.address=${MANABI_BIND_ADDRESS:127.0.0.1}
logging.level.org.flywaydb=WARN
logging.level.org.hibernate.orm.connections.pooling=WARN
server.servlet.session.persistent=false

# Separate Flyway credentials may be supplied without elevating the runtime DataSource.
spring.flyway.user=${DB_MIGRATION_USERNAME:${DB_USERNAME}}
spring.flyway.password=${DB_MIGRATION_PASSWORD:${DB_PASSWORD}}
manabi.publication.export.max-uncompressed-bytes=${MANABI_EXPORT_MAX_BYTES:134217728}
