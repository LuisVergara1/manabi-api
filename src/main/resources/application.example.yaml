spring:
  application:
    name: manabi-api

  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/manabi}
    username:  ${DB_USERNAME:root}
    password:  ${DB_PASSWORD:}

  jpa:
    hibernate:
      ddl-auto: update

    show-sql: false

    properties:
      hibernate:
        format_sql: true

  jackson:
    time-zone: America/Santiago

server:
  port: 8080

springdoc:
  api-docs:
    path: /api-docs

  swagger-ui:
    path: /swagger
    operations-sorter: method
    tags-sorter: alpha

logging:
  level:
    "[org.hibernate.SQL]": DEBUG
    "[org.hibernate.orm.jdbc.bind]": TRACE